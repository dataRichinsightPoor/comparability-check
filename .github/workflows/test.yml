name: Numerical tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node cli.mjs history 4 1 0.125
      - run: node cli.mjs bridge examples/common-shift.csv
      - run: node cli.mjs context examples/cell-context.json
      - run: node simulate.mjs 1000 26007 8 /tmp/comparability-simulations
